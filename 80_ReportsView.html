<script>
function reportRangeFor(period){
  const today=new Date(),start=new Date(today),end=new Date(today);
  if(period==='week'){const offset=(today.getDay()+6)%7;start.setDate(today.getDate()-offset);end.setDate(start.getDate()+4);}
  else if(period==='month'){start.setDate(1);}
  else if(period==='quarter'){start.setMonth(Math.floor(today.getMonth()/3)*3,1);}
  else if(period==='year'){start.setMonth(0,1);}
  return {start:dateKey(start),end:dateKey(end)};
}
function setReportPeriod(period){
  state.reportPeriod=period;
  if(period!=='custom'){const range=reportRangeFor(period);state.reportStart=range.start;state.reportEnd=range.end;}
  renderReports();
}
function renderReports(){
  const main=document.getElementById('main'),tasks=state.tasks||[],products=uniq(tasks.map(t=>t.product));
  if(!state.reportStart||!state.reportEnd){const range=reportRangeFor(state.reportPeriod||'month');state.reportStart=range.start;state.reportEnd=range.end;}
  const start=state.reportStart,end=state.reportEnd,product=state.reportProduct||'',period=state.reportPeriod||'month';
  const rows=tasks.filter(t=>{const date=String(t.dueDate||'');return date>=start&&date<=end&&(!product||t.product===product)});
  const groups=STATUS_COLUMNS.map(s=>[s.label,rows.filter(t=>groupStatus(t)===s.key).length]);
  const completed=groups.find(x=>x[0]==='Done')||['Done',0],inProgress=groups.find(x=>x[0]==='In Progress')||['In Progress',0],blocked=groups.find(x=>x[0]==='Blocked')||['Blocked',0];
  main.innerHTML=pageHead('Reports','Delivery reporting by period and product.')+
    `<section class="panel report-controls"><div class="panel-body"><div class="toolbar"><select class="control" onchange="setReportPeriod(this.value)">${[['week','This week'],['month','This month'],['quarter','This quarter'],['year','This year'],['custom','Custom range']].map(x=>`<option value="${x[0]}" ${x[0]===period?'selected':''}>${x[1]}</option>`).join('')}</select><input aria-label="Report start date" class="control" type="date" value="${start}" onchange="state.reportPeriod='custom';state.reportStart=this.value;renderReports()"><input aria-label="Report end date" class="control" type="date" value="${end}" onchange="state.reportPeriod='custom';state.reportEnd=this.value;renderReports()"><select aria-label="Report product" class="control" onchange="state.reportProduct=this.value;renderReports()"><option value="">All products</option>${products.map(p=>`<option value="${esc(p)}" ${p===product?'selected':''}>${esc(displayProduct(p))}</option>`).join('')}</select></div></div></section>`+
    `<div class="summary-kpis">${metric('Tasks due',rows.length,'Selected period','▤')}${metric('Completed',completed[1],'Tasks in Done','✓')}${metric('In progress',inProgress[1],'Active work','▶')}${metric('Blocked',blocked[1],'Needs attention','!')}</div>`+
    `<section class="panel"><div class="panel-head"><div><div class="panel-title">Status summary</div><div class="panel-sub">${esc(start)} – ${esc(end)} · ${esc(product?displayProduct(product):'All products')}</div></div></div><div class="panel-body"><div class="product-bars">${groups.map(x=>`<div class="bar-row"><span>${x[0]}</span><div class="bar-track"><div class="bar-fill" style="width:${rows.length?x[1]/rows.length*100:0}%"></div></div><b>${x[1]}</b></div>`).join('')}</div></div></section>`;
}
</script>
